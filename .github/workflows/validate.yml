name: Validate scaffold

on:
  push:
    branches: ["main", "feature/**", "docs/**", "build/**", "fix/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project metadata and pinned source
        run: python3 tools/validate_project.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n tools/collect_device_baseline.sh tools/sync_chromium.sh tools/build_webview.sh tools/check_build_host.sh
